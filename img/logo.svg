<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded-square badge, tinted-tile variant -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#e4ecfc" />

  <!-- "A" legs — the escalation path (Executive -> Manager) -->
  <path d="M28 76 L50 24 L72 76" fill="none" stroke="#16233b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Crossbar redrawn as a checkmark — "approved" -->
  <path d="M35 55 L45 65 L65 47" fill="none" stroke="#0d5fdb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>
